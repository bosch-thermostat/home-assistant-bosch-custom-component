debug_scan:
  description: >-
    Run raw scan for Bosch. It will be available as bosch_scan.json in your www dir of Home Assistant. You can check url of the file in logs after it. It doesn't matter which entity you choose. It makes scan for whole your setup. Typically it is https://ha/local/bosch_scan.json?vX . 
    There will be notification in HA with url of the scan. It takes several minutes to finish. Be patient!
    Choose any entity or device of your bosch inegration, it will find UUID and make scan for your whole Bosch setup. You don't need to choose water heater and climate separately!
  target:
    device:
      integration: bosch
update_thermostat:
  description: >-
    Update thermostat data manually. Automatically it occurs every 30 seconds. Avoid to use it a lot as Bosch gateway might block requests for some time.
  target:
    device:
      integration: bosch
update_recordings_sensor:
  description: >-
    Update thermostat recording/energy sensor manually. Automatically it occurs every 1 hour. Avoid to use it a lot as Bosch gateway might block requests for some time.
  target:
    device:
      integration: bosch
fetch_recordings_sensor_range:
  description: >-
    Fetch one past day, or an inclusive day..end_date range (max 30 days),
    into recording statistics. Avoid large ranges; the gateway may throttle.
  target:
    device:
      integration: bosch
  fields:
    day:
      name: Start date
      description: First local day to fetch
      example: '"2022-03-22"'
      selector:
        date:
    end_date:
      name: End date
      description: Last local day to fetch (optional; max 30 days from day)
      example: '"2022-04-20"'
      selector:
        date:
    statistic_id:
      name: Statistic ID
      description: Statistic ID, you can find proper id in Developer tools -> Statistics in column Statistic id.
      example: 'recording:routdoor_t1external'
      selector:
        text:
repair_energy_statistics:
  description: >-
    Re-import the last N full days of EasyControl energy statistics for CH/HW
    after a field-mapping fix. Never includes today.
  target:
    device:
      integration: bosch
  fields:
    days:
      name: Days
      description: Number of past days to repair (1-30)
      default: 7
      selector:
        number:
          min: 1
          max: 30
    logical_attr:
      name: Attribute
      description: Which energy series to repair
      default: all
      selector:
        select:
          options:
            - all
            - ch
            - hw
clear_energy_statistics:
  description: >-
    Permanently clear one energy statistic_id. Optionally reimport all history
    from the gateway afterwards.
  target:
    device:
      integration: bosch
  fields:
    statistic_id:
      name: Statistic ID
      description: Statistic id from Developer tools → Statistics
      example: 'energy:gchenergy_central_heatingexternal'
      selector:
        text:
    reimport:
      name: Reimport
      description: Fetch all history and write again after clear
      default: false
      selector:
        boolean:
backfill_environment_energy:
  description: >-
    Rebuild recording:renvironmentexternal and
    recording:rheatingdegreehoursexternal from existing hourly statistics for a
    local date range (inclusive). Long ranges are processed in 400-day chunks.
  target:
    device:
      integration: bosch
  fields:
    start_date:
      name: Start date
      description: First local day to backfill
      required: true
      selector:
        date:
    end_date:
      name: End date
      description: Last local day to backfill
      required: true
      selector:
        date:
set_dhw_charge:
  description: Charge DHW circuit.
  target:
    entity:
      integration: bosch
      domain: water_heater
  fields:
    value:
      description: Either start or stop
      select:
        options:
          - 'start'
          - 'stop'
send_custom_put_float:
  description: Send custom PUT command to your bosch gateway with Float value
  target:
    device:
      integration: bosch
  fields:
    path:
      description: URI to send put command
      example: '"/dhwCircuits/dhw1/temperatureLevels/high"'
    value:
      description: Value you want to send
      example: 50.0
      selector:
        number:
          min: 0
          max: 70
send_custom_put_string:
  description: Send custom PUT command to your bosch gateway with String value
  target:
    device:
      integration: bosch
  fields:
    path:
      description: URI to send put command
      example: '"/system/holidayModes/hm1/startStop"'
      selector:
        text:
    value:
      description: Value you want to send
      example: '2022-05-17'
      selector:
        text:
send_custom_get:
  description: Send custom GET command to your bosch gateway
  target:
    device:
      integration: bosch
  fields:
    path:
      required: true
      description: URI to send get command
      example: '"/system/holidayModes/hm1/startStop"'
      selector:
        text:
